name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      # Test suites remain available locally; CI runs only validation and builds.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run contracts:check
      - run: npm run verify:research
      - name: Validate experiment plans and saved exports
        run: |
          python .agents/scripts/experiment_contract.py plan .agents/examples/synthetic-plan.json
          python .agents/scripts/experiment_contract.py plan docs/research/plans/gross-test-02.json
          python .agents/scripts/experiment_contract.py plan docs/research/plans/gross-test-03.json
          python .agents/scripts/experiment_contract.py plan docs/research/plans/gross-test-04.json
          python .agents/scripts/experiment_contract.py scan research/experiments
      - run: npm run build
      - name: Run built CLI sample
        run: node apps/cli/dist/index.js --sample pair
