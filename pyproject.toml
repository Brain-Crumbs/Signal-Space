[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-space-research"
version = "0.2.0"
description = "GROSS-only Signal Space experiments, CLI and auditable evidence"
requires-python = ">=3.12"
dependencies = ["matplotlib==3.10.8", "numpy==2.3.5", "scipy==1.17.0", "psutil==7.2.2"]

[project.optional-dependencies]
performance = ["numba==0.67.0", "llvmlite==0.49.0"]

[project.scripts]
signal-space = "signal_space.cli:main"
signal-space-research = "signal_space.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["signal_space*"]

[tool.setuptools]
package-dir = {"" = "src"}
