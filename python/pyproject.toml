[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-space-research"
version = "0.1.0"
description = "Auditable local runtime for Signal Space research experiments"
requires-python = ">=3.12,<3.14"
dependencies = [
  "matplotlib==3.10.8",
  "numpy==2.3.5",
  "scipy==1.17.0"
]

[project.scripts]
signal-space-research = "signal_space.cli:main"

[tool.setuptools]
packages = [
  "signal_space",
  "signal_space.analysis",
  "signal_space.contracts",
  "signal_space.experiments",
  "signal_space.models",
  "signal_space.numerics",
  "signal_space.reporting",
  "signal_space.runtime",
  "signal_space.service"
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
